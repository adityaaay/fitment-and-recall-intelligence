[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitment-intel"
version = "1.0.0"
description = "Recall & fitment intelligence platform: NHTSA safety data + an aftermarket parts catalog, modeled into a DuckDB/dbt warehouse with an LLM analyst on top."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Sharma" }]
dependencies = [
    "duckdb>=1.2",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "pandas>=2.2",
    "pandera>=0.22",
    "pyarrow>=17",
    "httpx>=0.27",
    "tenacity>=9",
    "pyyaml>=6",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.24"]
agent = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fitment = "fitment_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: builds the full sample warehouse (slower)"]
